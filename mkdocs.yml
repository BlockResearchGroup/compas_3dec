site_name: COMPAS 3DEC
site_url: https://blockresearchgroup.github.io/compas_3dec/
repo_name: BlockResearchGroup/compas_3dec
repo_url: https://github.com/BlockResearchGroup/compas_3dec/
copyright: Copyright &copy; ETH Zurich - Block Research Group

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            filters: public
            inherited_members: false
            show_source: false
            show_submodules: false

nav:
  - Introduction: index.md
  - Installation: installation.md
  - Reference:
      - Public API: reference/compas_3dec.md
      - Solver: reference/compas_3dec.solver.md
      - Postprocessing: reference/compas_3dec.postprocessing.md
      - Rhino: reference/compas_3dec.rhino.md
  - License: license.md
