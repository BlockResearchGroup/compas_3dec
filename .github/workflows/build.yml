name: build

on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    if: "!contains(github.event.pull_request.labels.*.name, 'docs-only')"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "compas_dem @ git+https://github.com/BlockResearchGroup/compas_dem.git@main"
          python -m pip install -e ".[dev,docs]"
      - name: Lint and format check
        run: |
          python -m ruff check src tests scripts tasks.py
          python -m ruff format --check src tests scripts tasks.py
      - name: Run tests
        run: python -m pytest
