name: verify-pr-checklist
on:
  pull_request:
    types: [assigned, opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main
      - master

jobs:
  build:
    name: Check Actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check that the changelog was updated
        shell: bash
        run: |
          if ! git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" | grep -qx "CHANGELOG.md"; then
            echo "CHANGELOG.md must be updated"
            exit 1
          fi
