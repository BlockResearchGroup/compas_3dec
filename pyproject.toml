[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "compas_3dec"
description = "A COMPAS integration for rigid-block analysis with Itasca 3DEC."
keywords = ["compas", "3dec", "dem", "masonry", "rigid-block"]
authors = [
    { name = "Alessandro Dell'Endice", email = "dellendice@arch.ethz.ch" },
    { name = "Petras Vestartas" },
]
license = "MIT"
license-files = ["LICENSE", "AUTHORS.md"]
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["compas>=2.0"]

[project.optional-dependencies]
dem = ["compas_dem", "compas_model"]
dev = [
    "build",
    "bump-my-version",
    "compas_dem",
    "compas_invocations2",
    "compas_model",
    "invoke>=0.14",
    "pytest",
    "ruff",
    "twine",
    "wheel",
]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocstrings[python]"]

[project.urls]
Homepage = "https://github.com/BRG-research/compas_3dec"
Documentation = "https://BRG-research.github.io/compas_3dec"
Repository = "https://github.com/BRG-research/compas_3dec.git"
Changelog = "https://github.com/BRG-research/compas_3dec/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true
zip-safe = false

[tool.setuptools.dynamic]
version = { attr = "compas_3dec.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests", "src/compas_3dec"]
python_files = ["test_*.py", "*_test.py", "test.py"]
addopts = ["-ra", "--strict-markers", "--doctest-glob=*.rst", "--tb=short"]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "IGNORE_EXCEPTION_DETAIL",
    "ALLOW_UNICODE",
    "ALLOW_BYTES",
    "NUMBER",
]

[tool.bumpversion]
current_version = "0.2.0"
message = "Bump version to {new_version}"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "src/compas_3dec/__init__.py"
search = "{current_version}"
replace = "{new_version}"

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "Unreleased"
replace = "[{new_version}] {now:%Y-%m-%d}"

[tool.ruff]
line-length = 179
indent-width = 4
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["I001"]
"tests/*" = ["I001"]
"scripts/*" = ["I001"]
"scripts/view_results_rhino.py" = ["E402", "I001"]
"src/compas_3dec/solver/fish/dialect.py" = ["E501"]
"tasks.py" = ["I001"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["compas", "compas_3dec", "compas_dem", "compas_model"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"
